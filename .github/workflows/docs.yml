name: Docs

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check spelling
        run: npm run check:spelling

      - name: Build docs (anchors + sidebar + VitePress)
        run: npm run docs:build

      - name: Check external links (strict)
        run: npm run check:external -- --strict
